# Cosy Castle — iOS build on Codemagic (cloud Mac). Flat repo layout.
# Codemagic-managed automatic signing (ios_signing) via "CosyCastle_ASC":
# it creates & stores the distribution certificate and provisioning profile,
# then use-profiles applies them to the Xcode project.
workflows:
  ios-capacitor:
    name: Cosy Castle iOS
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: CosyCastle_ASC
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.cosycastle.app
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.cosycastle.app"
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Prepare web dir
        script: mkdir -p www && cp index.html www/index.html
      - name: Install dependencies
        script: npm install
      - name: Add iOS platform
        script: npx cap add ios || true
      - name: Generate icons & splash
        script: npx capacitor-assets generate --ios --assetPath . --iconBackgroundColor '#FB4E00' --splashBackgroundColor '#FB4E00' || true
      - name: Capacitor sync
        script: npx cap sync ios
      - name: Install CocoaPods
        script: cd ios/App && pod install
      - name: Force bundle identifier
        script: |
          cd ios/App
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = [^;]*;/PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID;/g" App.xcodeproj/project.pbxproj
      - name: Set up code signing on Xcode project
        script: xcode-project use-profiles
      - name: Build ipa
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
