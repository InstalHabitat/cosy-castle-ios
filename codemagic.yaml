# Cosy Castle — iOS build on Codemagic (cloud Mac). Flat repo layout.
# Manual code signing: creates the distribution certificate + provisioning
# profile automatically via the "CosyCastle_ASC" App Store Connect integration.
workflows:
  ios-capacitor:
    name: Cosy Castle iOS
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: CosyCastle_ASC
    environment:
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.cosycastle.app"
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Prepare web dir
        script: mkdir -p www && cp index.html www/index.html
      - name: Install dependencies
        script: npm install
      - name: Add iOS platform
        script: npx cap add ios || true
      - name: Generate icons & splash
        script: npx capacitor-assets generate --ios --assetPath . --iconBackgroundColor '#FB4E00' --splashBackgroundColor '#FB4E00' || true
      - name: Capacitor sync
        script: npx cap sync ios
      - name: Create signing certificate (if missing)
        script: |
          app-store-connect certificates create \
            --type IOS_DISTRIBUTION \
            --save || echo "Certificate may already exist, continuing."
      - name: Fetch/create provisioning profile
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
      - name: Set up keychain and certificates
        script: |
          keychain initialize
          keychain add-certificates
      - name: Use provisioning profiles in Xcode project
        script: xcode-project use-profiles
      - name: Build ipa
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
